name: CI

on:
  pull_request:
  push:
    branches: [master]

# Yalnız okuma: CI kod çalıştırır (pnpm install, velite, eslint); yazma
# yetkili bir GITHUB_TOKEN'a ihtiyacı yok.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      # Action'lar etiket değil commit SHA'sıyla sabit (etiket sonradan
      # taşınabilir); yorumdaki sürüm okunabilirlik için.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # lint ve typecheck kendi içlerinde `velite build` çalıştırır (içerik
      # katmanı .velite/ üretilmeden tsc blog tiplerini çözemez). Hiçbiri env
      # değişkeni gerektirmez — `next build` bilinçli olarak CI'da koşmuyor,
      # çünkü DATABASE_URL / UPSTASH / R2 secret'ları ister.
      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
