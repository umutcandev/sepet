name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # lint ve typecheck kendi içlerinde `velite build` çalıştırır (içerik
      # katmanı .velite/ üretilmeden tsc blog tiplerini çözemez). Hiçbiri env
      # değişkeni gerektirmez — `next build` bilinçli olarak CI'da koşmuyor,
      # çünkü DATABASE_URL / UPSTASH / R2 secret'ları ister.
      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
